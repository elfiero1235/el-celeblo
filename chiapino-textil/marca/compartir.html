<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}html,body{width:1200px;height:630px;overflow:hidden}
body{background:#eef2f8;font-family:"Public Sans",sans-serif;color:#101a33;display:grid;grid-template-columns:1fr 470px}
.t{padding:64px 0 56px 72px;display:flex;flex-direction:column}
.logo{display:inline-flex;flex-direction:column;line-height:.82;font-family:"Archivo"}
.logo span{transform:skewX(-10deg);transform-origin:0 100%;font-weight:700;font-size:34px;color:#1d3f9a;margin-left:4px}
.logo b{font-weight:900;font-size:68px;color:#cc2626;font-stretch:72%}
h1{margin-top:auto;font:900 76px/.95 "Archivo";font-stretch:78%;letter-spacing:-.02em}h1 em{font-style:normal;color:#cc2626}
p{margin-top:22px;font-size:25px;color:#4a5672}
.f{position:relative;background:#fff}
.f img{position:absolute;inset:40px 48px 40px 0;width:calc(100% - 48px);height:calc(100% - 80px);object-fit:cover;border-radius:28px}
</style></head><body>
<div class="t"><div class="logo"><span>Textil</span><b>CHIAPINO</b></div>
<h1>Todo para coser,<br><em>y quien te la arregle.</em></h1>
<p>Máquinas, hilos y service en Paraná · stock al día</p></div>
<div class="f"><img src="../img/silverman-overlock.jpg"></div>
</body></html>
