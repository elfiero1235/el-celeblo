<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1600px;height:1000px;background:#eef2f8;font-family:"Public Sans",sans-serif;color:#101a33;padding:64px 72px}
h1{margin-bottom:44px;font:900 64px/1 "Archivo";font-stretch:80%;letter-spacing:-.02em}h1 span{color:#cc2626}
.sub{font-size:24px;color:#4a5672;margin:14px 0 48px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{background:#fff;border-radius:28px;padding:36px 32px 32px;text-align:center;border:1px solid rgba(16,26,51,.12)}
.card img.big{width:240px;height:240px}
.k{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#101a33;color:#fff;font:900 26px "Archivo";margin-top:18px}
.card h2{font:800 34px "Archivo";font-stretch:85%;margin:12px 0 6px}.card p{font-size:20px;color:#4a5672}
.prev{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:12px;background:#101a33;color:#fff;border-radius:999px;padding:10px 22px 10px 10px;width:fit-content;margin-inline:auto}
.prev img{width:46px;height:46px}.prev b{font:800 22px "Archivo";font-stretch:85%}.prev small{display:block;font-size:14px;opacity:.75;text-align:left}
</style></head><body>
<h1><span>Chapitex</span></h1>
<div class="grid">
<div class="card"><img class="big" src="a-pregunta.svg"><div class="k">A</div><h2>Máquina</h2><p>Una máquina de coser con cara</p><div class="prev"><img src="a-pregunta.svg"><div><b>Chapitex</b><small>Asistente de Textil Chiapino</small></div></div></div>
<div class="card"><img class="big" src="b-pregunta.svg"><div class="k">B</div><h2>Carretel</h2><p>Un carretel de hilo con cara</p><div class="prev"><img src="b-pregunta.svg"><div><b>Chapitex</b><small>Asistente de Textil Chiapino</small></div></div></div>
<div class="card"><img class="big" src="c-pregunta.svg"><div class="k">C</div><h2>Monograma</h2><p>Una C de Chiapino cosida</p><div class="prev"><img src="c-pregunta.svg"><div><b>Chapitex</b><small>Asistente de Textil Chiapino</small></div></div></div>
</div></body></html>
